<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Excel／CSV 比對</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .msg {
        margin: 2px 0 0;
      }
      .msg {
        margin-top: 8px;
      }
      h2 {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        font: inherit;
        font-size: 13px;
        border: 1px solid var(--bd);
        border-radius: 6px;
      }
      input[type='text'], input[type='password'] {
        font: inherit;
        font-size: 13px;
      }
      input[type='text'], input[type='password'] {
        width: 100%;
      }
      option {
        background: var(--card);
      }
      .panel {
        display: none;
      }
      .row {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        margin: 10px 0;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      textarea {
        display: block;
        height: 80px;
        margin-top: 8px;
        border: 1px solid var(--bd);
        border-radius: 6px;
        padding: 8px;
        font:
          12.5px/1.5 ui-monospace,
          Menlo,
          Consolas,
          'Noto Sans TC',
          monospace;
      }
      .opt {
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
        margin: 8px 0;
      }
      .opt label {
        gap: 4px;
      }
      .chip {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        border: 1px solid var(--bd);
        border-radius: 14px;
        padding: 1px 10px;
        margin: 3px 4px 3px 0;
        cursor: pointer;
        font-size: 13px;
      }
      .tw {
        overflow: auto;
        max-height: 70vh;
        border: 1px solid var(--bd);
        margin-top: 8px;
      }
      table {
        font:
          12.5px/1.5 'Noto Sans TC',
          system-ui,
          sans-serif;
        width: max-content;
        min-width: 100%;
      }
      th {
        border: 1px solid var(--bd);
        padding: 3px 8px;
        white-space: pre-wrap;
        max-width: 360px;
        vertical-align: top;
        word-break: break-all;
      }
      td {
        border-width: 1px;
        border-style: solid;
        border-color: var(--bd);
        padding: 3px 8px;
        white-space: pre-wrap;
        max-width: 360px;
        vertical-align: top;
        word-break: break-all;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--gut);
        z-index: 1;
      }
      td.st {
        white-space: nowrap;
      }
      td.st small {
        color: var(--mut);
      }
      .r-add td {
        background: var(--add);
      }
      .r-del td {
        background: var(--del);
      }
      .r-mod td.chg {
        background: color-mix(in srgb, var(--pri) 20%, transparent);
      }
      td.chg s {
        color: #bf616a;
      }
      td.chg b {
        color: #4d7c4a;
      }
      @media (max-width:760px) {
        .grid2 {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <a class="back" href="index.html">← 返回小工具集首頁</a>
          <h1>Excel／CSV 比對</h1>
          <p class="tagline">找出兩份表格新增、刪除、修改的列</p>
        </div>
        <div class="themes" id="themes">主題：</div>
      </header>
      <p class="privacy">檔案只在你的瀏覽器本機處理，不會上傳。支援 xlsx、xls、ods、csv、tsv，也可以直接貼上內容。</p>
      <div class="grid2">
        <section>
          <h2>A　舊檔</h2>
          <div class="drop-zone" id="dzA">
            拖曳或點擊選擇 Excel／CSV<input type="file" id="fA" accept=".xlsx,.xlsm,.xls,.xlsb,.ods,.csv,.tsv,.txt" />
          </div>
          <div class="opt">
            <select id="shA" style="display: none"></select
            ><span class="msg" id="infoA"></span>
          </div>
          <textarea id="taA" placeholder="或直接貼上從 Excel 複製的內容"></textarea>
        </section>
        <section>
          <h2>B　新檔</h2>
          <div class="drop-zone" id="dzB">
            拖曳或點擊選擇 Excel／CSV<input type="file" id="fB" accept=".xlsx,.xlsm,.xls,.xlsb,.ods,.csv,.tsv,.txt" />
          </div>
          <div class="opt">
            <select id="shB" style="display: none"></select
            ><span class="msg" id="infoB"></span>
          </div>
          <textarea id="taB" placeholder="或直接貼上從 Excel 複製的內容"></textarea>
        </section>
      </div>
      <section>
        <h2>比對設定</h2>
        <div class="opt">
          <label><input type="checkbox" id="hdr" checked /> 第一列是欄位標題（兩邊以標題名稱對應欄位）</label
          ><label><input type="checkbox" id="trim" checked /> 忽略前後空白</label
          ><label><input type="checkbox" id="ic" /> 忽略大小寫</label>
        </div>
        <div>
          主鍵欄位（用來判斷「同一列」，可多選）：
          <div id="keys">（請先載入檔案）</div>
        </div>
        <div class="opt">
          <label><input type="checkbox" id="nokey" /> 不使用主鍵，依列順序一一對應</label>
        </div>
        <div class="row"><button class="pri" id="go" disabled>開始比對</button><span class="msg" id="msg"></span></div>
      </section>
      <section id="resSec" style="display: none">
        <h2>比對結果</h2>
        <div id="sum"></div>
        <div id="warn" class="msg"></div>
        <div id="flt"></div>
        <div class="tw"><table id="tbl"></table></div>
        <div class="row"><button id="xl">下載差異報告 (.xlsx)</button></div>
      </section>
      <footer>SheetJS</footer>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
      const $ = id => document.getElementById(id);

      const S = { a: null, b: null },
        ST = { add: '新增', del: '刪除', mod: '修改', same: '相同' };
      let LAST = null,
        selKeys = new Set();
      const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
      function parseText(t) {
        t = t.replace(/^\uFEFF/, '');
        // Count possible delimiters outside quoted fields in the first logical record.
        const counts = { '\t': 0, ',': 0, ';': 0 };
        let inQuote = false;
        for (let i = 0; i < t.length; i++) {
          const c = t[i];
          if (c === '"') {
            if (inQuote && t[i + 1] === '"') {
              i++;
              continue;
            }
            inQuote = !inQuote;
            continue;
          }
          if (!inQuote && (c === '\n' || c === '\r')) break;
          if (!inQuote && Object.prototype.hasOwnProperty.call(counts, c)) counts[c]++;
        }
        const d = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
        const rows = [];
        let row = [],
          f = '',
          q = false;
        for (let i = 0; i < t.length; i++) {
          const c = t[i];
          if (q) {
            if (c === '"') {
              if (t[i + 1] === '"') {
                f += '"';
                i++;
              } else q = false;
            } else f += c;
          } else if (c === '"' && f === '') q = true;
          else if (c === d) {
            row.push(f);
            f = '';
          } else if (c === '\n' || c === '\r') {
            if (c === '\r' && t[i + 1] === '\n') i++;
            row.push(f);
            rows.push(row);
            row = [];
            f = '';
          } else f += c;
        }
        if (f !== '' || row.length) {
          row.push(f);
          rows.push(row);
        }
        return rows.filter(r => r.some(x => x !== ''));
      }
      const rowsOf = s => (S[s] ? S[s].sheets[S[s].sheet] : null);
      function table(s) {
        const rows = rowsOf(s) || [],
          h = $('hdr').checked,
          n = rows.reduce((m, r) => Math.max(m, r.length), 0),
          seen = {};
        const cols = Array.from({ length: n }, (_, i) => {
          let c = h ? String((rows[0] || [])[i] ?? '').trim() : '';
          c = c || '欄' + (i + 1);
          if (seen[c]) {
            seen[c]++;
            c += '_' + seen[c];
          } else seen[c] = 1;
          return c;
        });
        return { cols, body: rows.slice(h ? 1 : 0), off: h ? 2 : 1 };
      }
      function setSide(s, o) {
        S[s] = o;
        const K = s.toUpperCase(),
          sh = $('sh' + K),
          names = Object.keys(o.sheets);
        sh.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
        sh.style.display = names.length > 1 ? '' : 'none';
        sh.value = o.sheet;
        $('info' + K).textContent = o.name + '：' + rowsOf(s).length + ' 列';
        renderKeys();
        $('go').disabled = !(S.a && S.b);
      }
      async function loadFile(s, f) {
        try {
          const buf = await f.arrayBuffer();
          if (/\.(xlsx|xlsm|xls|xlsb|ods)$/i.test(f.name)) {
            const wb = XLSX.read(buf, { type: 'array' }),
              sheets = {};
            wb.SheetNames.forEach(
              n =>
                (sheets[n] = XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, defval: '', raw: false }).map(r => r.map(x => String(x))))
            );
            setSide(s, { name: f.name, sheets, sheet: wb.SheetNames[0] });
          } else {
            let t;
            try {
              t = new TextDecoder('utf-8', { fatal: true }).decode(buf);
            } catch (e) {
              t = new TextDecoder('big5').decode(buf);
            }
            setSide(s, { name: f.name, sheets: { '(CSV)': parseText(t) }, sheet: '(CSV)' });
          }
        } catch (e) {
          $('info' + s.toUpperCase()).textContent = '讀取失敗：' + e.message;
        }
      }
      ['a', 'b'].forEach(s => {
        const K = s.toUpperCase(),
          dz = $('dz' + K),
          fi = $('f' + K);
        fi.onchange = e => {
          const f = e.target.files[0];
          e.target.value = '';
          if (f) loadFile(s, f);
        };
        dz.onclick = e => {
          if (e.target !== fi) fi.click();
        };
        dz.ondragover = e => {
          e.preventDefault();
          dz.classList.add('dragover');
        };
        dz.ondragleave = () => dz.classList.remove('dragover');
        dz.ondrop = e => {
          e.preventDefault();
          dz.classList.remove('dragover');
          const f = e.dataTransfer.files[0];
          if (f) loadFile(s, f);
        };
        $('sh' + K).onchange = e => {
          S[s].sheet = e.target.value;
          $('info' + K).textContent = S[s].name + '：' + rowsOf(s).length + ' 列';
          renderKeys();
        };
        let tm;
        $('ta' + K).oninput = e => {
          clearTimeout(tm);
          tm = setTimeout(() => {
            const t = e.target.value;
            if (!t.trim()) return;
            setSide(s, { name: '貼上內容', sheets: { 貼上: parseText(t) }, sheet: '貼上' });
          }, 400);
        };
      });
      ['dragover', 'drop'].forEach(v =>
        window.addEventListener(v, e => {
          if (!e.target.closest('.drop-zone')) e.preventDefault();
        })
      );
      $('hdr').onchange = renderKeys;
      function renderKeys() {
        const cols = [...new Set(['a', 'b'].filter(s => S[s]).flatMap(s => table(s).cols))];
        if (!cols.length) {
          $('keys').textContent = '（請先載入檔案）';
          return;
        }
        selKeys = new Set([...selKeys].filter(c => cols.includes(c)));
        if (!selKeys.size) selKeys.add(cols[0]);
        $('keys').innerHTML = cols
          .map(
            c =>
              `<label class="chip"><input type="checkbox" class="kc" value="${esc(c)}"${selKeys.has(c) ? ' checked' : ''}>${esc(c)}</label>`
          )
          .join('');
      }
      $('keys').onchange = e => {
        if (e.target.classList.contains('kc')) e.target.checked ? selKeys.add(e.target.value) : selKeys.delete(e.target.value);
      };
      $('go').onclick = () => {
        const tr = $('trim').checked,
          ic = $('ic').checked;
        const nv = v => {
          let s = String(v ?? '');
          if (tr) s = s.trim();
          if (ic) s = s.toLowerCase();
          if (/^-?(0|[1-9]\d*)(\.\d+)?$/.test(s)) s = String(Number(s));
          return s;
        };
        const A = table('a'),
          B = table('b'),
          cols = [...A.cols, ...B.cols.filter(c => !A.cols.includes(c))],
          both = cols.filter(c => A.cols.includes(c) && B.cols.includes(c));
        const keys = [...selKeys].filter(k => cols.includes(k)),
          pos = $('nokey').checked || !keys.length;
        const obj = (t, r) => {
          const o = {};
          t.cols.forEach((c, i) => (o[c] = r[i] ?? ''));
          return o;
        };
        const keyOf = (o, i) => (pos ? String(i) : keys.map(k => nv(o[k] ?? '')).join('\u0001'));
        let dup = 0;
        const mapB = new Map();
        B.body.forEach((r, i) => {
          const o = obj(B, r),
            k = keyOf(o, i);
          let n = 0,
            kk = k;
          while (mapB.has(kk)) {
            n++;
            kk = k + '\u0002' + n;
          }
          if (n) dup++;
          mapB.set(kk, { o, rb: i + B.off, used: false });
        });
        const seen = new Map(),
          res = [],
          st = { add: 0, del: 0, mod: 0, same: 0 };
        A.body.forEach((r, i) => {
          const o = obj(A, r),
            k = keyOf(o, i),
            c = seen.get(k) || 0;
          seen.set(k, c + 1);
          if (c) dup++;
          const m = mapB.get(c ? k + '\u0002' + c : k),
            ra = i + A.off;
          if (!m) {
            res.push({ s: 'del', a: o, ra });
            st.del++;
            return;
          }
          m.used = true;
          const d = both.filter(col => nv(o[col]) !== nv(m.o[col]));
          if (d.length) {
            res.push({ s: 'mod', a: o, b: m.o, d, ra, rb: m.rb });
            st.mod++;
          } else {
            res.push({ s: 'same', a: o, b: m.o, d: [], ra, rb: m.rb });
            st.same++;
          }
        });
        mapB.forEach(m => {
          if (!m.used) {
            res.push({ s: 'add', b: m.o, rb: m.rb });
            st.add++;
          }
        });
        LAST = {
          res,
          cols,
          st,
          keys: pos ? [] : keys,
          onlyA: A.cols.filter(c => !B.cols.includes(c)),
          onlyB: B.cols.filter(c => !A.cols.includes(c)),
        };
        $('sum').textContent = `新增 ${st.add}　刪除 ${st.del}　修改 ${st.mod}　相同 ${st.same}`;
        const w = [];
        if (dup) w.push(`有 ${dup} 列主鍵重複，已依出現順序配對，建議改選更能辨識唯一列的主鍵`);
        if (LAST.onlyA.length) w.push('只在 A 的欄位：' + LAST.onlyA.join('、'));
        if (LAST.onlyB.length) w.push('只在 B 的欄位：' + LAST.onlyB.join('、'));
        $('warn').textContent = w.join('；');
        $('flt').innerHTML = ['mod', 'add', 'del', 'same']
          .map(k => `<label class="chip"><input type="checkbox" data-s="${k}"${k === 'same' ? '' : ' checked'}>${ST[k]} ${st[k]}</label>`)
          .join('');
        $('resSec').style.display = '';
        renderTable();
      };
      $('flt').onchange = () => renderTable();
      function renderTable() {
        const { res, cols } = LAST,
          on = new Set([...document.querySelectorAll('#flt input:checked')].map(x => x.dataset.s)),
          CAP = 3000;
        const rs = res.filter(r => on.has(r.s)),
          shown = rs.slice(0, CAP);
        const val = (r, c) => (r.a && c in r.a ? r.a[c] : r.b ? (r.b[c] ?? '') : '');
        $('tbl').innerHTML =
          '<thead><tr><th>狀態</th>' +
          cols.map(c => `<th>${esc(c)}</th>`).join('') +
          '</tr></thead><tbody>' +
          shown
            .map(r => {
              const loc = r.s === 'del' ? 'A' + r.ra : r.s === 'add' ? 'B' + r.rb : `A${r.ra}→B${r.rb}`;
              return (
                `<tr class="r-${r.s}"><td class="st">${ST[r.s]} <small>${loc}</small></td>` +
                cols
                  .map(c =>
                    r.s === 'mod' && r.d.includes(c)
                      ? `<td class="chg"><s>${esc(r.a[c])}</s> <b>${esc(r.b[c])}</b></td>`
                      : `<td>${esc(val(r, c))}</td>`
                  )
                  .join('') +
                '</tr>'
              );
            })
            .join('') +
          '</tbody>';
        $('msg').textContent = rs.length > CAP ? `畫面只顯示前 ${CAP} 列（共 ${rs.length} 列），完整內容請下載差異報告` : '';
      }
      $('xl').onclick = () => {
        const { res, cols, st, keys, onlyA, onlyB } = LAST,
          wb = XLSX.utils.book_new(),
          add = (n, a) => XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(a), n);
        add('摘要', [
          ['項目', '數量'],
          ['新增列', st.add],
          ['刪除列', st.del],
          ['修改列', st.mod],
          ['相同列', st.same],
          [],
          ['只在 A 的欄位', onlyA.join('、')],
          ['只在 B 的欄位', onlyB.join('、')],
        ]);
        const kc = keys.length ? keys : [],
          chg = [];
        res
          .filter(r => r.s === 'mod')
          .forEach(r =>
            r.d.forEach(c => chg.push([...(kc.length ? kc.map(k => r.a[k]) : ['A' + r.ra + ' / B' + r.rb]), c, r.a[c], r.b[c]]))
          );
        add('修改明細', [[...(kc.length ? kc : ['列號']), '欄位', '舊值 (A)', '新值 (B)'], ...chg]);
        add('新增列', [['B 列號', ...cols], ...res.filter(r => r.s === 'add').map(r => [r.rb, ...cols.map(c => r.b[c] ?? '')])]);
        add('刪除列', [['A 列號', ...cols], ...res.filter(r => r.s === 'del').map(r => [r.ra, ...cols.map(c => r.a[c] ?? '')])]);
        XLSX.writeFile(wb, 'compare_result.xlsx');
      };
    </script>
  </body>
</html>
