.wrap{max-width:1180px;width:100%;margin:0 auto;padding:16px clamp(12px,2vw,24px) 56px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:20px}
.back{display:block;color:var(--mut);font-size:12px;text-decoration:none}.back:hover{color:var(--pri)}
.sub,.msg{color:var(--mut);font-size:12px;margin:2px 0 0}
.themes{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--bd);cursor:pointer}
.sw.on{outline:2px solid var(--pri);outline-offset:2px}
section{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:12px}

button:hover{border-color:var(--pri)}
.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg)}

textarea{font-family:var(--sym);font-size:22px;line-height:1.4;resize:vertical;min-height:56px}
:root{--sym:"Noto Sans TC","Segoe UI Symbol","Apple Symbols","Noto Sans Symbols","Noto Sans Symbols 2","Noto Sans Math","Cambria Math","Arial Unicode MS",sans-serif}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:var(--prifg)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.e{font-family:var(--sym);font-variant-emoji:text;font-size:24px;line-height:1;height:48px;padding:0;background:var(--gut);border:1px solid transparent;border-radius:8px;overflow:hidden}
.e:hover,.e.sel{border-color:var(--pri)}
.empty{color:var(--mut);padding:20px;text-align:center;grid-column:1/-1}
#info{display:none;gap:14px;align-items:center;flex-wrap:wrap}
#info.on{display:flex}
#big{font-family:var(--sym);font-variant-emoji:text;font-size:44px;line-height:1;min-width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--gut);border-radius:8px;padding:0 8px}
#iname{font-weight:700;font-size:15px}
#ien{color:var(--mut);font-size:12px}

<div class="wrap">
<header><div><a class="back" href="index.html">← 回小工具集</a><h1>特殊符號圖庫</h1><p class="sub">點一下就複製，也會加進下方組合區，可一次複製多個。收錄運算符號、箭頭、希臘字母、上下標、製表線、編號、標點、貨幣、注音等約 2,083 個符號，可用中文、英文或 Unicode 碼位搜尋。</p></div><div class="themes" id="themes">主題：</div></header>

<section>
<textarea id="mix" placeholder="組合區：點選的符號會出現在這裡，也可以直接輸入文字"></textarea>
<div class="row"><button class="pri" id="copyAll">複製全部</button><button id="undo">刪除最後一個</button><button id="clr">清空</button></div>
</section>

<section id="info">
<div id="big"></div>
<div><div id="iname"></div><div id="ien"></div>
<div class="chips" id="chips"></div></div>
</section>

<section>
<div class="row" style="margin:0"><input type="text" id="q" placeholder="搜尋，例如：箭頭、積分、arrow、約等於、2192（可用空格組合多個關鍵字）" autocomplete="off" style="flex:1;min-width:200px"></div>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="row"><span class="msg" id="count"></span><button id="clrRecent" style="display:none;margin-left:auto">清除最近使用</button></div>
</section>
<footer>符號的外觀會因作業系統與字型而不同；較新或較冷門的符號在舊版系統可能顯示為方框。點選符號後可複製它的 Unicode 碼、HTML、JavaScript、CSS 寫法。</footer>

const E=D.map(x=>({c:x[0],zh:x[1],en:x[2],kw:x[3],ci:x[4],h:(x[1]+' '+x[2]+' '+x[3]).toLowerCase(),code:x[0].codePointAt(0).toString(16).padStart(4,'0')}));
const BYCHAR=new Map(E.map(x=>[x.c,x]));
let cat='全部',recent=[],cur=null;
try{recent=JSON.parse(localStorage.getItem('symbol-recent')||'[]');if(!Array.isArray(recent))recent=[]}catch(e){recent=[]}
const tabs=['全部','最近使用',...CATS];
const U=c=>c.codePointAt(0).toString(16).toUpperCase().padStart(4,'0');

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1200)}
async function copy(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok;
  }
}
function match(x,t){
  if(x.h.includes(t)||x.c.includes(t))return true;
  const m=/^(u\+|0x)?([0-9a-f]{2,6})$/.exec(t);
  return !!m&&(m[1]||/\d/.test(m[2]))&&x.code.includes(m[2]);
}
function render(){
  const terms=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list;
  if(cat==='最近使用')list=recent.map(c=>BYCHAR.get(c)).filter(Boolean);
  else list=E.filter(x=>cat==='全部'||CATS[x.ci]===cat);
  if(terms.length)list=list.filter(x=>terms.every(t=>match(x,t)));
  const fr=document.createDocumentFragment();
  list.forEach(x=>{const b=document.createElement('button');b.className='e'+(cur&&cur.c===x.c?' sel':'');b.textContent=x.c;b.title=[x.zh,x.en,'U+'+U(x.c)].filter(Boolean).join(' · ');b.onclick=()=>pick(x);fr.appendChild(b)});
  $('grid').innerHTML='';
  if(!list.length)$('grid').innerHTML='<div class="empty">'+(cat==='最近使用'&&!terms.length?'還沒有最近使用的符號':'找不到符合的符號')+'</div>';
  else $('grid').appendChild(fr);
  $('count').textContent=list.length+' 個';
  $('clrRecent').style.display=cat==='最近使用'&&recent.length?'':'none';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===cat));
}
function showInfo(x){
  cur=x;const cp=x.c.codePointAt(0),hex=U(x.c);
  $('big').textContent=x.c;
  $('iname').textContent=x.zh||x.en;
  $('ien').textContent=(x.zh&&x.en?x.en+' · ':'')+CATS[x.ci];
  const forms=[['U+'+hex,'U+'+hex],['HTML','&#'+cp+';'],['JS',cp>0xFFFF?'\\u{'+hex+'}':'\\u'+hex],['CSS','\\'+hex.toLowerCase()]];
  const ch=$('chips');ch.innerHTML='';
  forms.forEach(([l,v])=>{const b=document.createElement('button');b.textContent=l===v?v:l+' '+v;b.title='複製 '+v;b.onclick=async()=>toast(await copy(v)?'已複製 '+v:'複製失敗');ch.appendChild(b)});
  $('info').classList.add('on');
}
async function pick(x){
  const c=x.c;
  $('mix').value+=c;
  recent=[c,...recent.filter(v=>v!==c)].slice(0,40);
  try{localStorage.setItem('symbol-recent',JSON.stringify(recent))}catch(_){}
  showInfo(x);
  toast(await copy(c)?'已複製 '+c:'複製失敗，請從組合區手動複製');
  if(cat==='最近使用')render();
  else document.querySelectorAll('#grid .e').forEach(b=>b.classList.toggle('sel',b.textContent===c));
}
tabs.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.dataset.t=t;b.onclick=()=>{cat=t;render()};$('tabs').appendChild(b)});
$('q').oninput=render;
$('copyAll').onclick=async()=>{const v=$('mix').value;if(!v)return toast('組合區是空的');toast(await copy(v)?'已複製全部':'複製失敗')};
$('undo').onclick=()=>{const a=[...$('mix').value];a.pop();$('mix').value=a.join('')};
$('clr').onclick=()=>{$('mix').value=''};
$('clrRecent').onclick=()=>{recent=[];try{localStorage.removeItem('symbol-recent')}catch(e){}render()};
render();
