D.forEach(x=>{x.h=(x[1]+' '+x[2]+' '+x[3]).toLowerCase()});
const MODS=['','\u{1F3FB}','\u{1F3FC}','\u{1F3FD}','\u{1F3FE}','\u{1F3FF}'];
let cat='全部',recent=[],tone=0;
try{recent=JSON.parse(localStorage.getItem('emoji-recent')||'[]');tone=+localStorage.getItem('emoji-tone')||0}catch(e){}
const show=x=>x[5]?x[0].replace(/\u{1F3FB}/gu,MODS[tone]):x[0];
const tabs=['全部','最近使用',...CATS];

function toast(t){const el=$('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1200)}
async function copy(t){
  try{await navigator.clipboard.writeText(t);return true}catch(e){
    const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
    let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok;
  }
}
function render(){
  const terms=$('q').value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  let list;
  if(cat==='最近使用')list=recent.map(e=>D.find(x=>show(x)===e)||[e,'','','',0,0]).map(x=>x.h===undefined?{0:x[0],1:x[1],2:x[2],h:(x[1]+' '+x[2]+' '+x[0]).toLowerCase(),5:0,raw:1}:x);
  else list=D.filter(x=>cat==='全部'||CATS[x[4]]===cat);
  if(terms.length)list=list.filter(x=>terms.every(t=>x.h.includes(t)||x[0].includes(t)));
  const fr=document.createDocumentFragment();
  list.forEach(x=>{const b=document.createElement('button');b.className='e';const e=x.raw?x[0]:show(x);b.textContent=e;b.title=[x[2],x[1]].filter(Boolean).join(' · ')||e;b.onclick=()=>pick(e);fr.appendChild(b)});
  $('grid').innerHTML='';
  if(!list.length)$('grid').innerHTML='<div class="empty">'+(cat==='最近使用'&&!terms.length?'還沒有最近使用的 emoji':'找不到符合的 emoji')+'</div>';
  else $('grid').appendChild(fr);
  $('count').textContent=list.length+' 個';
  $('clrRecent').style.display=cat==='最近使用'&&recent.length?'':'none';
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===cat));
}
async function pick(e){
  $('mix').value+=e;
  recent=[e,...recent.filter(x=>x!==e)].slice(0,30);
  try{localStorage.setItem('emoji-recent',JSON.stringify(recent))}catch(_){}
  toast(await copy(e)?'已複製 '+e:'複製失敗，請從組合區手動複製');
  if(cat==='最近使用')render();
}
tabs.forEach(t=>{const b=document.createElement('button');b.textContent=t;b.dataset.t=t;b.onclick=()=>{cat=t;render()};$('tabs').appendChild(b)});
$('tone').value=tone;
$('tone').onchange=()=>{tone=+$('tone').value;try{localStorage.setItem('emoji-tone',tone)}catch(e){}render()};
$('q').oninput=render;
$('copyAll').onclick=async()=>{const v=$('mix').value;if(!v)return toast('組合區是空的');toast(await copy(v)?'已複製全部':'複製失敗')};
$('undo').onclick=()=>{const v=$('mix').value;const a=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter(undefined,{granularity:'grapheme'}).segment(v)].map(x=>x.segment):[...v];a.pop();$('mix').value=a.join('')};
$('clr').onclick=()=>{$('mix').value=''};
$('clrRecent').onclick=()=>{recent=[];try{localStorage.removeItem('emoji-recent')}catch(e){}render()};
render();
</script>
