<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code／條碼工具</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%F0%9F%94%B3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('tools-theme')||localStorage.getItem('diff-theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--card:#fff;--fg:#1f2328;--mut:#6b7280;--bd:#d0d7de;--gut:#eef0f3;--add:#c8f0cf;--del:#ffd0d0;--emp:#e9ebee;--pri:#2563eb;--prifg:#fff}
@media (prefers-color-scheme:dark){html:not([data-theme]){color-scheme:dark;--bg:#0f1115;--card:#171a21;--fg:#e6e8eb;--mut:#9aa3af;--bd:#2d333b;--gut:#1e232b;--add:#1d5a2c;--del:#6b2323;--emp:#20242c;--pri:#4c8dff;--prifg:#fff}}
html[data-theme=dark]{color-scheme:dark;--bg:#0f1115;--card:#171a21;--fg:#e6e8eb;--mut:#9aa3af;--bd:#2d333b;--gut:#1e232b;--add:#1d5a2c;--del:#6b2323;--emp:#20242c;--pri:#4c8dff;--prifg:#fff}
html[data-theme=sepia]{color-scheme:light;--bg:#f1e8d4;--card:#fbf5e6;--fg:#3b3226;--mut:#7d705c;--bd:#d9cbaa;--gut:#efe4c9;--add:#cfe8b8;--del:#f4c9b8;--emp:#ebe0c4;--pri:#a8652a;--prifg:#fff}
html[data-theme=forest]{color-scheme:light;--bg:#eaf2ec;--card:#f8fcf9;--fg:#1d2b22;--mut:#5f7566;--bd:#c3d6c8;--gut:#dfeae2;--add:#bfe8c9;--del:#f5cdcd;--emp:#dce8df;--pri:#2f855a;--prifg:#fff}
html[data-theme=ocean]{color-scheme:dark;--bg:#0b1e2d;--card:#10293c;--fg:#dbe9f4;--mut:#8fa9bd;--bd:#1f4059;--gut:#0d2335;--add:#17604a;--del:#7a2f3f;--emp:#0e2536;--pri:#2bb3d9;--prifg:#04202c}
html[data-theme=dracula]{color-scheme:dark;--bg:#1e1f29;--card:#282a36;--fg:#f8f8f2;--mut:#a0a4c0;--bd:#44475a;--gut:#2f3140;--add:#2c6e49;--del:#7d2f46;--emp:#2b2d3a;--pri:#bd93f9;--prifg:#1e1f29}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Noto Sans TC",system-ui,-apple-system,sans-serif}
a{color:var(--pri)}
.wrap{max-width:860px;margin:0 auto;padding:14px 20px 60px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{margin:0;font-size:20px}
.back{display:block;color:var(--mut);font-size:12px;text-decoration:none}.back:hover{color:var(--pri)}
.sub,.tagline,.adv-hint,.msg{color:var(--mut);font-size:12px;margin:2px 0 0}
.msg{font-size:13px;margin-top:8px}
.themes{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--bd);cursor:pointer}
.sw.on{outline:2px solid var(--pri);outline-offset:2px}
section{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin-bottom:12px}
h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.num{width:20px;height:20px;border-radius:50%;background:var(--gut);color:var(--mut);font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.privacy,.warn{color:var(--mut);font-size:12px;border-left:3px solid var(--pri);padding:6px 10px;margin:8px 0;background:var(--gut)}
.warn{border-left-color:#e5484d}
button,.btn{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
button:hover:not(:disabled),.btn:hover{border-color:var(--pri)}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg)}
input[type=file]{display:none}
select,input[type=text],input[type=password]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
input[type=text],input[type=password]{width:100%}
option{background:var(--card);color:var(--fg)}
.drop-zone{border:2px dashed var(--bd);border-radius:8px;padding:28px 16px;text-align:center;cursor:pointer;color:var(--mut);transition:border-color .15s,background .15s}
.drop-zone:hover,.drop-zone.dragover{border-color:var(--pri);color:var(--fg);background:var(--gut)}
.drop-zone input{display:none}
#fileList{margin-top:10px;font-size:13px;color:var(--mut);max-height:140px;overflow-y:auto}
.file-row{border-bottom:1px dashed var(--bd);padding:2px 0}
.clear-link{color:var(--pri);cursor:pointer;text-decoration:underline;font-size:12px}
.field{margin-bottom:12px}
.radio-group label{display:block;margin:6px 0;cursor:pointer}
.radio-group input,.translate-toggle input{margin-right:6px}
.lang-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;margin-top:6px}
.lang-grid label{cursor:pointer;display:flex;align-items:center;gap:6px}
.translate-toggle{display:block;margin-bottom:10px;cursor:pointer}
#translateOptions .field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
details.advanced{margin-top:14px;border:1px solid var(--bd);border-radius:6px}
details.advanced summary{cursor:pointer;padding:8px 12px;font-size:13px;color:var(--mut)}
.adv-body{padding:4px 14px 12px}
.adv-field{margin-bottom:12px}
.adv-field label{display:block;margin-bottom:4px;color:var(--mut)}
.chip-btn{display:inline-block;font-size:12px;color:var(--pri);border:1px solid var(--pri);border-radius:12px;padding:1px 9px;margin:6px 6px 0 0;cursor:pointer}
.progress-bar-bg,.item-progress-bg{background:var(--gut);border-radius:4px;overflow:hidden}
.progress-bar-bg{height:8px}.item-progress-bg{height:4px}
.progress-bar-fill,.item-progress-fill{height:100%;width:0;background:var(--pri);transition:width .2s}
.item-progress-fill.error{background:#e5484d}
#progressArea{margin-top:14px}
#progressText{margin:8px 0;color:var(--mut);font-size:13px}
#statusList{list-style:none;padding:0;margin:0;max-height:180px;overflow-y:auto;border:1px solid var(--bd);border-radius:6px;font-size:12.5px}
#statusList li{padding:6px 8px;border-bottom:1px dashed var(--bd)}
.status-label{margin-bottom:4px}
#previewText{white-space:pre-wrap;background:var(--gut);border:1px solid var(--bd);border-radius:6px;padding:10px;max-height:260px;overflow-y:auto;margin-top:12px;color:var(--mut);font:12.5px/1.6 ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:var(--prifg)}
.panel{display:none}.panel.on{display:block}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.lst div{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--bd)}
.lst span{flex:1;word-break:break-all}
footer{margin-top:24px;font-size:12px;color:var(--mut);text-align:center}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:18px}
.tool{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:16px;color:var(--fg);text-decoration:none}
.tool:hover,.tool:focus-visible{border-color:var(--pri);outline:none}
.tool b{font-size:16px}.tool span{color:var(--mut);font-size:13px}.tool small{color:var(--mut);font-size:12px;margin-top:auto;padding-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:640px){.grid{grid-template-columns:1fr}}
textarea{display:block;width:100%;height:90px;resize:vertical;border:1px solid var(--bd);border-radius:6px;padding:8px;background:var(--card);color:var(--fg);font:13px/1.6 "Noto Sans TC",system-ui,sans-serif}
.f{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.f>span{min-width:96px;color:var(--mut)}
input[type=number]{width:80px;font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
input[type=color]{width:42px;height:28px;padding:0;border:1px solid var(--bd);border-radius:4px;background:none}
.pv{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px;border:1px solid var(--bd);border-radius:8px;background:var(--gut)}
#cv{max-width:100%;height:auto;image-rendering:pixelated}
#vid{width:100%;max-height:320px;background:#000;border-radius:8px;display:none}
.res div{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--bd)}.res span{flex:1;word-break:break-all;white-space:pre-wrap}
</style>
</head>
<body>
<div class="wrap">
<header><div><a class="back" href="index.html">← 小工具首頁</a><h1>QR Code／條碼工具</h1><p class="tagline">產生與掃描 QR Code、Data Matrix、PDF417、Aztec 及常見 1D 條碼</p></div><div class="themes" id="themes">主題：</div></header>
<p class="privacy">產生與掃描都在你的瀏覽器本機完成，內容不會上傳。相機掃描需要 HTTPS 網頁，並允許相機權限。</p>
<div class="tabs"><button data-t="gen" class="on">產生</button><button data-t="scan">掃描</button></div>
<div class="panel on" id="p-gen"><div class="grid"><section><h2>內容與參數</h2>
<textarea id="txt" placeholder="輸入要編碼的文字或網址">https://example.com</textarea>
<div class="f"><span>編碼格式</span><select id="fmt"><optgroup label="2D 條碼"><option value="qrcode">QR Code</option><option value="microqrcode">Micro QR</option><option value="datamatrix">Data Matrix</option><option value="pdf417">PDF417</option><option value="azteccode">Aztec</option></optgroup><optgroup label="1D 條碼"><option value="code128">Code 128</option><option value="ean13">EAN-13</option><option value="upca">UPC-A</option><option value="code39">Code 39</option></optgroup></select></div>
<div class="f" id="r-ec"><span>QR 糾錯等級</span><select id="ec"><option value="L">L（約 7%）</option><option value="M" selected>M（約 15%）</option><option value="Q">Q（約 25%）</option><option value="H">H（約 30%）</option></select></div>
<div class="f"><span>每格大小</span><input type="number" id="sc" value="6" min="1" max="30"> px</div>
<div class="f"><span>白邊（安靜區）</span><input type="number" id="mg" value="4" min="0" max="30"> 格</div>
<div class="f"><span>前景／背景色</span><input type="color" id="fg" value="#000000"><input type="color" id="bg" value="#ffffff"></div>
<div class="f" id="r-1d" style="display:none"><span>1D 條碼高度</span><input type="number" id="ht" value="14" min="3" max="80"> mm <label><input type="checkbox" id="it" checked> 顯示文字</label></div>
<p class="adv-hint">QR 掃描建議保留 4 格白邊、深色前景配淺色背景。</p></section>
<section><h2>預覽</h2><div class="pv"><canvas id="cv" width="10" height="10"></canvas><span class="msg" id="size"></span><span class="msg" id="err" style="color:#e5484d"></span>
<div class="row"><button class="pri" id="dpng">下載 PNG</button><button id="dsvg">下載 SVG</button></div></div></section></div></div>
<div class="panel" id="p-scan"><section><h2>掃描</h2>
<div class="drop-zone" id="dz">拖曳或點擊選擇含條碼的圖片<input type="file" id="fin" accept="image/*"></div>
<div class="row"><button id="cam">開啟相機掃描</button><span class="msg" id="smsg"></span></div>
<video id="vid" playsinline muted></video><canvas id="sc2" style="display:none"></canvas>
<div class="res" id="res"></div></section></div>
<footer>bwip-js（產生）＋ ZXing（掃描）</footer>
</div>
<script src="https://cdn.jsdelivr.net/npm/bwip-js@4/dist/bwip-js-min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const THEMES = [['auto','跟隨系統','#ffffff','#171a21'],['light','淺色','#f6f7f9','#2563eb'],['dark','深色','#0f1115','#4c8dff'],
  ['sepia','護眼米黃','#f1e8d4','#a8652a'],['forest','森林綠','#eaf2ec','#2f855a'],['ocean','深海藍','#0b1e2d','#2bb3d9'],['dracula','紫夜','#282a36','#bd93f9']];
function applyTheme(t){
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem('tools-theme', t); } catch(e){}
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}
THEMES.forEach(([id, name, c1, c2]) => {
  const b = document.createElement('button');
  b.className = 'sw'; b.dataset.t = id; b.title = name;
  b.style.background = `linear-gradient(135deg,${c1} 50%,${c2} 50%)`;
  b.onclick = () => applyTheme(id);
  $('themes').appendChild(b);
});
applyTheme(document.documentElement.dataset.theme || 'auto');


document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(q=>q.classList.toggle('on',q.id==='p-'+b.dataset.t));if(b.dataset.t==='gen')camOff()});
const D1=['code128','ean13','upca','code39'],hex=c=>c.replace('#','');
let encMode='raw',cur=null;
const enc=t=>encMode==='utf8'?unescape(encodeURIComponent(t)):t;
function opts(txt){
  const f=$('fmt').value,o={bcid:f,text:txt,scale:Math.max(1,+$('sc').value||6),barcolor:hex($('fg').value),backgroundcolor:hex($('bg').value)};
  if(f==='qrcode')o.eclevel=$('ec').value;
  if(D1.includes(f)){o.height=+$('ht').value||14;o.includetext=$('it').checked;o.textxalign='center'}
  return o;
}
function draw(){
  const t=$('txt').value;$('err').textContent='';
  if(!t){$('cv').width=$('cv').height=10;$('size').textContent='';cur=null;return}
  try{
    const o=opts(enc(t)),c=document.createElement('canvas');bwipjs.toCanvas(c,o);
    const m=Math.round(Math.max(0,+$('mg').value||0)*o.scale),out=$('cv');
    out.width=c.width+2*m;out.height=c.height+2*m;
    const x=out.getContext('2d');x.fillStyle=$('bg').value;x.fillRect(0,0,out.width,out.height);x.drawImage(c,m,m);
    $('size').textContent=out.width+' × '+out.height+' px';cur={o,w:c.width,h:c.height,m};
  }catch(e){cur=null;$('err').textContent='無法產生：'+String((e&&e.message)||e).replace(/^bwipp\.[^:]*:?\s*/,'')}
}
function fmtChange(){const f=$('fmt').value;$('r-ec').style.display=f==='qrcode'?'':'none';$('r-1d').style.display=D1.includes(f)?'':'none';draw()}
['txt','ec','sc','mg','fg','bg','ht','it'].forEach(i=>$(i).addEventListener('input',draw));$('fmt').onchange=fmtChange;
function save(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1e4)}
$('dpng').onclick=()=>{if(cur)$('cv').toBlob(b=>save(b,$('fmt').value+'.png'))};
$('dsvg').onclick=()=>{
  if(!cur)return;const{o,w,h,m}=cur,s=bwipjs.toSVG(o),vb=(s.match(/viewBox=["']([^"']+)["']/)||[])[1]||`0 0 ${w} ${h}`;
  const inner=s.replace(/^[\s\S]*?<svg[^>]*>/,'').replace(/<\/svg>\s*$/,''),W=w+2*m,H=h+2*m;
  save(new Blob([`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><rect width="${W}" height="${H}" fill="${$('bg').value}"/><svg x="${m}" y="${m}" width="${w}" height="${h}" viewBox="${vb}">${inner}</svg></svg>`],{type:'image/svg+xml'}),$('fmt').value+'.svg');
};
// ---- 掃描 ----
function decodeCanvas(c){
  const h=new Map();h.set(ZXing.DecodeHintType.TRY_HARDER,true);
  const rd=new ZXing.MultiFormatReader();rd.setHints(h);
  const r=rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c))));
  return{text:r.getText(),fmt:ZXing.BarcodeFormat[r.getBarcodeFormat()]};
}
function show(r){
  const d=document.createElement('div'),s=document.createElement('span'),b=document.createElement('button');
  s.textContent='['+r.fmt+'] '+r.text;b.textContent='複製';b.onclick=async()=>{try{await navigator.clipboard.writeText(r.text);b.textContent='已複製'}catch(e){}setTimeout(()=>b.textContent='複製',1500)};
  d.append(s,b);$('res').prepend(d);
}
async function scanFile(f){
  $('smsg').textContent='辨識中...';
  try{
    const bm=await createImageBitmap(f,{imageOrientation:'from-image'}).catch(()=>createImageBitmap(f));
    for(const lim of [2000,1000,600]){
      const k=Math.min(1,lim/Math.max(bm.width,bm.height)),c=$('sc2');c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);
      const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
      try{show(decodeCanvas(c));$('smsg').textContent='完成';return}catch(e){}
    }
    $('smsg').textContent='找不到條碼（可試試更清晰、較大或對比較高的圖片）';
  }catch(e){$('smsg').textContent='失敗：'+e.message}
}
$('fin').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)scanFile(f)};
const dz=$('dz');dz.onclick=e=>{if(e.target!==$('fin'))$('fin').click()};
dz.ondragover=e=>{e.preventDefault();dz.classList.add('dragover')};dz.ondragleave=()=>dz.classList.remove('dragover');
dz.ondrop=e=>{e.preventDefault();dz.classList.remove('dragover');const f=[...e.dataTransfer.files].find(f=>/^image\//.test(f.type));if(f)scanFile(f)};
['dragover','drop'].forEach(v=>window.addEventListener(v,e=>{if(!dz.contains(e.target))e.preventDefault()}));
let stream=null,timer=null;
function camOff(){clearInterval(timer);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;$('vid').style.display='none';$('cam').textContent='開啟相機掃描'}
$('cam').onclick=async()=>{
  if(stream)return camOff();
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});
    const v=$('vid');v.srcObject=stream;v.style.display='block';await v.play();$('cam').textContent='關閉相機';$('smsg').textContent='請將條碼對準鏡頭';
    timer=setInterval(()=>{if(!v.videoWidth)return;const c=$('sc2');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);try{show(decodeCanvas(c));$('smsg').textContent='已掃描到內容';camOff()}catch(e){}},200);
  }catch(e){camOff();$('smsg').textContent='無法開啟相機：'+(e.name==='NotAllowedError'?'未允許相機權限':e.message)}
};
// ---- 啟動：偵測 bwip-js 對中文的編碼方式，確保 QR 內容以 UTF-8 掃出正確文字 ----
(function(){
  try{
    for(const mode of ['raw','utf8']){
      const t=mode==='utf8'?unescape(encodeURIComponent('中文')):'中文',c=document.createElement('canvas');
      bwipjs.toCanvas(c,{bcid:'qrcode',text:t,scale:4});
      const o=document.createElement('canvas');o.width=c.width+64;o.height=c.height+64;const x=o.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,o.width,o.height);x.drawImage(c,32,32);
      try{if(decodeCanvas(o).text==='中文'){encMode=mode;break}}catch(e){}
    }
  }catch(e){}
  fmtChange();
})();
</script>
</body>
</html>
