<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem('tools-theme')||localStorage.getItem('diff-theme');if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Noto Sans TC",system-ui,-apple-system,sans-serif}
.wrap{max-width:1180px;width:100%;margin:0 auto;padding:16px clamp(12px,2vw,24px) 56px}
h1{margin:0;font-size:20px}
.back{display:block;color:var(--mut);font-size:12px;text-decoration:none}.back:hover{color:var(--pri)}
.sub,.tip{color:var(--mut);font-size:12px;margin:2px 0 0}
section{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 14px;margin:12px 0}
button,.btn{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px;text-decoration:none;display:inline-block}
button:hover:not(:disabled),.btn:hover{border-color:var(--pri)}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tabs button.on{background:var(--pri);border-color:var(--pri);color:var(--prifg)}
.panel{display:none}.panel.on{display:block}
select,input[type=text],textarea{font:inherit;font-size:13px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
option{background:var(--card);color:var(--fg)}
textarea{width:100%;min-height:150px;resize:vertical;font:12.5px/1.5 ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace;word-break:break-all}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.lbl{font-size:12px;color:var(--mut);margin:8px 0 4px;display:block}
.drop{display:block;border:2px dashed var(--bd);border-radius:8px;padding:26px 16px;text-align:center;cursor:pointer;color:var(--mut)}
.drop:hover,.drop.over{border-color:var(--pri);color:var(--fg);background:var(--gut)}
input[type=file]{display:none}
.info{background:var(--gut);border-radius:6px;padding:8px 10px;font-size:13px;margin:8px 0}
.warn{border-left:3px solid #bf616a;background:var(--gut);color:var(--mut);font-size:12px;padding:6px 10px;margin:8px 0}
.prev{margin-top:10px;text-align:center}
.prev img,.prev video{max-width:100%;max-height:420px;border:1px solid var(--bd);border-radius:6px}
.prev audio{width:100%}.prev iframe{width:100%;height:480px;border:1px solid var(--bd);border-radius:6px}
.err{color:#bf616a;font-size:13px}
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
<header><a class="back" href="index.html">← 回主選單</a><h1>編碼／解碼工具</h1><p class="sub">Base64 檔案轉換與常用文字編碼。所有處理都在你的瀏覽器內完成，內容不會上傳。</p></header>
<div class="tabs" id="tabs"><button data-p="pt" class="on">編碼／解碼</button><button data-p="pf">檔案 → Base64</button></div>

<div class="panel on" id="pt"><section>
 <div class="row"><select id="fmt"></select><button class="pri" id="enc">編碼 ↓</button><button id="dec">解碼 ↓</button><button id="swp">↕ 輸出移到輸入</button></div>
 <span class="lbl">輸入</span><textarea id="tin" spellcheck="false" placeholder="貼上要編碼或解碼的文字（Base64 也可直接貼上 Data URI 或 &lt;img&gt; 標籤）"></textarea>
 <span class="lbl">輸出</span><textarea id="tout" spellcheck="false" readonly></textarea>
 <div class="info" id="tinfo" style="display:none"></div>
 <div class="row" id="tact" style="display:none">檔名：<input type="text" id="tname" style="width:200px"><button id="tsave" class="pri">下載檔案</button></div>
 <div class="prev" id="tprev"></div>
 <div class="row"><button id="tcopy">複製輸出</button><label class="btn">載入文字檔<input type="file" id="tfile" accept=".txt,.b64,.base64,text/plain"></label><button id="tclr">清除</button><span class="err" id="terr"></span></div>
 <p class="tip" id="thint"></p>
</section></div>

<div class="panel" id="pf"><section>
 <label class="drop" id="fdrop"><input type="file" id="ffile">點擊或拖曳任何檔案到這裡（圖片、PDF、音訊、影片、執行檔、壓縮檔…）</label>
 <div class="info" id="finfo" style="display:none"></div>
 <div class="row" id="fopt" style="display:none">輸出格式：
  <select id="fmode"><option value="raw">純 Base64</option><option value="uri">Data URI（data:類型;base64,…）</option><option value="url">Base64URL（URL 安全）</option><option value="wrap">純 Base64，每 76 字元換行（MIME）</option><option value="html">HTML &lt;img&gt; 標籤（僅圖片）</option></select>
  <button class="pri" id="fcopy">複製</button><button id="fsave">下載為 .txt</button><button id="fclr">清除</button></div>
 <textarea id="fout" spellcheck="false" readonly style="display:none"></textarea>
 <p class="tip" id="fnote"></p>
</section></div>

</div>
<script>
const $=id=>document.getElementById(id);
const te=new TextEncoder();
/* ---------- 通用 ---------- */
function bytesToB64(u){let s=[];for(let i=0;i<u.length;i+=30000)s.push(btoa(String.fromCharCode.apply(null,u.subarray(i,i+30000))));return s.join('')}
function b64ToBytes(s){s=s.replace(/[\s]/g,'').replace(/-/g,'+').replace(/_/g,'/');if(/[^A-Za-z0-9+/=]/.test(s))throw new Error('含有非 Base64 字元');
 s=s.replace(/=+$/,'');if(s.length%4===1)throw new Error('Base64 長度不正確');s+='='.repeat((4-s.length%4)%4);
 const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
const utf8=u=>new TextDecoder('utf-8',{fatal:true}).decode(u);
const size=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const copy=async(t,b)=>{try{await navigator.clipboard.writeText(t);const o=b.textContent;b.textContent='已複製';setTimeout(()=>b.textContent=o,1200)}catch(e){}};
function dl(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p))});

/* ---------- 文字編解碼 ---------- */
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const rot=(s,n)=>s.replace(/[a-z]/gi,c=>{const b=c<='Z'?65:97;return String.fromCharCode((c.charCodeAt(0)-b+n)%26+b)});
const hx=u=>[...u].map(x=>x.toString(16).padStart(2,'0'));
const CODECS={
 b64:{n:'Base64',e:s=>bytesToB64(te.encode(s)),db:s=>b64ToBytes(extractB64(s)),h:'標準 Base64。解碼時支援 Data URI、<img> 標籤，可還原成圖片、PDF、音訊、執行檔等檔案並預覽、下載。'},
 b64u:{n:'Base64URL',e:s=>bytesToB64(te.encode(s)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''),db:s=>b64ToBytes(extractB64(s)),h:'URL／JWT 常用，以 - _ 取代 + /，不補 =。'},
 b32:{n:'Base32',e:s=>{const u=te.encode(s);let bits='',o='';u.forEach(x=>bits+=x.toString(2).padStart(8,'0'));for(let i=0;i<bits.length;i+=5)o+=B32[parseInt(bits.slice(i,i+5).padEnd(5,'0'),2)];return o+'='.repeat((8-o.length%8)%8)},
  db:s=>{s=s.replace(/[\s=]/g,'').toUpperCase();let bits='';for(const c of s){const i=B32.indexOf(c);if(i<0)throw new Error('含有非 Base32 字元');bits+=i.toString(2).padStart(5,'0')}const u=[];for(let i=0;i+8<=bits.length;i+=8)u.push(parseInt(bits.slice(i,i+8),2));return new Uint8Array(u)},h:'RFC 4648 Base32，常見於 TOTP 金鑰。'},
 hex:{n:'十六進位 Hex',e:s=>hx(te.encode(s)).join(' '),db:s=>{s=s.replace(/0x|[\s,:]/gi,'');if(/[^0-9a-f]/i.test(s)||s.length%2)throw new Error('不是有效的 Hex');return Uint8Array.from(s.match(/../g)||[],x=>parseInt(x,16))},h:'每個位元組兩位十六進位。'},
 bin:{n:'二進位 Binary',e:s=>[...te.encode(s)].map(x=>x.toString(2).padStart(8,'0')).join(' '),db:s=>{s=s.replace(/\s/g,'');if(/[^01]/.test(s)||s.length%8)throw new Error('不是有效的二進位（需為 8 的倍數）');return Uint8Array.from(s.match(/.{8}/g)||[],x=>parseInt(x,2))},h:'每個位元組 8 位元。'},
 url:{n:'URL 百分比編碼',e:s=>encodeURIComponent(s),d:s=>decodeURIComponent(s.replace(/\+/g,' ')),h:'encodeURIComponent，空白會變 %20；解碼時 + 視為空白。'},
 html:{n:'HTML 實體',e:s=>s.replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';').replace(/[^\x00-\x7f]/gu,c=>'&#x'+c.codePointAt(0).toString(16).toUpperCase()+';'),d:s=>new DOMParser().parseFromString(s,'text/html').documentElement.textContent,h:'特殊符號與非 ASCII 字元轉成 &#x…;，解碼支援 &amp; 等具名實體。'},
 uni:{n:'Unicode 跳脫 \\uXXXX',e:s=>s.replace(/[^\x00-\x7f]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0')),d:s=>s.replace(/\\u\{([0-9a-f]+)\}/gi,(m,h)=>String.fromCodePoint(parseInt(h,16))).replace(/\\u([0-9a-f]{4})/gi,(m,h)=>String.fromCharCode(parseInt(h,16))),h:'JavaScript／JSON 字串常見；解碼也支援 \\u{1F600}。'},
 qp:{n:'Quoted-Printable',e:s=>[...te.encode(s)].map(x=>(x>32&&x<127&&x!==61)||x===32?String.fromCharCode(x):'='+x.toString(16).toUpperCase().padStart(2,'0')).join('').replace(/\n/g,'\n'),d:s=>{s=s.replace(/=\r?\n/g,'');const o=[];for(let i=0;i<s.length;i++){if(s[i]==='='&&/^[0-9a-f]{2}$/i.test(s.substr(i+1,2))){o.push(parseInt(s.substr(i+1,2),16));i+=2}else o.push(...te.encode(s[i]))}return utf8(Uint8Array.from(o))},h:'電子郵件內文常見。'},
 rot13:{n:'ROT13',e:s=>rot(s,13),d:s=>rot(s,13),h:'只位移英文字母，編碼與解碼相同（不是加密）。'},
 esc:{n:'JSON 字串跳脫',e:s=>JSON.stringify(s).slice(1,-1),d:s=>JSON.parse('"'+s.replace(/"/g,'\\"').replace(/\\\\"/g,'\\"')+'"'),h:'換行、引號、反斜線轉成 \\n \\" \\\\。'}
};
let hintMime='';
function extractB64(s){hintMime='';const m=s.match(/data:([^;,"'<>]*)(?:;[^,"'<>]*)?,([^"')<>]+)/i);if(m){hintMime=m[1];return m[2]}return s}
for(const k of Object.keys(CODECS)){const c=CODECS[k];if(c.db)c.d=s=>utf8(c.db(s))}
$('fmt').innerHTML=Object.entries(CODECS).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
const hint=()=>$('thint').textContent=CODECS[$('fmt').value].h;hint();$('fmt').onchange=hint;
let D=null,pu=null,binOut=false;
function clearRes(){if(pu){URL.revokeObjectURL(pu);pu=null}D=null;binOut=false;$('tprev').innerHTML='';$('tinfo').style.display=$('tact').style.display='none'}
function showBytes(u){
 const t=sniff(u);let ext=t.e,mt=t.m;
 if(hintMime&&(t.e==='bin'||t.e==='txt')){mt=hintMime;ext=(hintMime.split('/')[1]||'bin').split('+')[0].replace('plain','txt').replace('jpeg','jpg')}
 D={u,mt,ext};const isText=['txt','json','html','svg'].includes(t.e);binOut=!isText;
 $('tout').value=isText?utf8(u):`（${t.n}，${size(u.length)}，不是文字；請看下方預覽，或下載檔案）`;
 $('tinfo').style.display=$('tact').style.display='';
 $('tinfo').innerHTML=`偵測結果：<b>${t.n}</b>｜大小 ${size(u.length)}｜MIME：${mt}`;
 if(!$('tname').dataset.u)$('tname').value='decoded.'+ext;
 pu=URL.createObjectURL(new Blob([u],{type:mt}));const p=$('tprev');
 if(t.e==='svg'||(mt.startsWith('image/')&&mt!=='image/heic'))p.innerHTML=`<img src="${pu}" alt="預覽">`;
 else if(mt.startsWith('audio/'))p.innerHTML=`<audio controls src="${pu}"></audio>`;
 else if(mt.startsWith('video/'))p.innerHTML=`<video controls src="${pu}"></video>`;
 else if(mt==='application/pdf')p.innerHTML=`<iframe src="${pu}" title="PDF 預覽"></iframe>`;
 else if(/executable|mach|java-vm|wasm|portable/.test(mt))p.innerHTML='<div class="warn" style="text-align:left">這是可執行檔，已停用預覽。請先確認來源可信，再下載；建議先用防毒軟體掃描，且不要直接執行。</div>';
 else if(binOut)p.innerHTML='<p class="tip">此類型無法在瀏覽器預覽，請直接下載。</p>'}
function run(m){
 $('terr').textContent='';clearRes();
 let k=$('fmt').value;
 if(m==='d'&&k!=='b64'&&k!=='b64u'&&/data:[^,]*;base64,/i.test($('tin').value)){k='b64';$('fmt').value=k;hint()}
 const c=CODECS[k];
 try{hintMime='';if(m==='d'&&c.db)showBytes(c.db($('tin').value));else $('tout').value=c[m]($('tin').value)}
 catch(e){$('tout').value='';$('terr').textContent='失敗：'+(e.message||'輸入格式不正確')}}
$('enc').onclick=()=>run('e');$('dec').onclick=()=>run('d');
$('swp').onclick=()=>{if(binOut){$('terr').textContent='輸出是檔案，無法移到輸入';return}$('tin').value=$('tout').value;$('tout').value='';clearRes()};
$('tcopy').onclick=e=>{if(!binOut)copy($('tout').value,e.target)};
$('tname').oninput=()=>$('tname').dataset.u=1;
$('tsave').onclick=()=>D&&dl(new Blob([D.u],{type:D.mt}),$('tname').value.trim()||'decoded.'+D.ext);
$('tfile').onchange=async e=>{const f=e.target.files[0];if(f){$('tin').value=await f.text();e.target.value='';run('d')}};
$('tclr').onclick=()=>{$('tin').value=$('tout').value='';$('terr').textContent='';$('tname').value='';$('tname').dataset.u='';clearRes()};

/* ---------- 檔案 → Base64 ---------- */
let F=null;
const mk=(f,raw)=>{const m=f.type||'application/octet-stream';
 const mode=$('fmode').value;
 if(mode==='uri')return`data:${m};base64,${raw}`;
 if(mode==='url')return raw.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
 if(mode==='wrap')return raw.replace(/.{76}/g,'$&\n');
 if(mode==='html')return`<img src="data:${m};base64,${raw}" alt="">`;
 return raw};
function showF(){if(!F)return;const t=mk(F.file,F.raw);F.text=t;const LIM=200000;
 $('fout').style.display='';$('fopt').style.display='';
 $('fout').value=t.length>LIM?t.slice(0,LIM)+'\n…（內容過長，這裡只顯示前 '+LIM.toLocaleString()+' 字元；「複製」與「下載」仍為完整內容）':t;
 $('fnote').textContent=`編碼後 ${t.length.toLocaleString()} 字元，約為原檔的 ${(t.length/Math.max(F.file.size,1)*100).toFixed(0)}%。`}
async function doFile(f){if(!f)return;$('finfo').style.display='';$('finfo').textContent='處理中…';
 try{const u=new Uint8Array(await f.arrayBuffer());F={file:f,raw:bytesToB64(u)};
  $('finfo').textContent=`${f.name}｜${f.type||'未知類型'}｜${size(f.size)}`;showF()}catch(e){$('finfo').textContent='讀取失敗：'+e.message}}
$('ffile').onchange=e=>doFile(e.target.files[0]);
const dz=$('fdrop');['dragenter','dragover'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.add('over')}));
['dragleave','drop'].forEach(v=>dz.addEventListener(v,e=>{e.preventDefault();dz.classList.remove('over')}));
dz.addEventListener('drop',e=>doFile(e.dataTransfer.files[0]));
$('fmode').onchange=showF;
$('fclr').onclick=()=>{F=null;$('ffile').value='';$('finfo').style.display=$('fopt').style.display=$('fout').style.display='none';$('fout').value=$('fnote').textContent=''};
$('fcopy').onclick=e=>F&&copy(F.text,e.target);
$('fsave').onclick=()=>F&&dl(new Blob([F.text],{type:'text/plain'}),F.file.name+'.base64.txt');

/* ---------- Base64 → 檔案 ---------- */
const SIG=[['89504E47','png','image/png','PNG 圖片'],['FFD8FF','jpg','image/jpeg','JPEG 圖片'],['47494638','gif','image/gif','GIF 圖片'],['25504446','pdf','application/pdf','PDF 文件'],
 ['504B0304','zip','application/zip','ZIP／Office 壓縮檔（docx、xlsx、pptx、apk、jar 皆同格式）'],['52617221','rar','application/vnd.rar','RAR 壓縮檔'],['377ABCAF','7z','application/x-7z-compressed','7-Zip 壓縮檔'],['1F8B08','gz','application/gzip','GZIP 壓縮檔'],
 ['4F676753','ogg','audio/ogg','OGG 音訊'],['664C6143','flac','audio/flac','FLAC 音訊'],['494433','mp3','audio/mpeg','MP3 音訊'],['FFFB','mp3','audio/mpeg','MP3 音訊'],['FFF3','mp3','audio/mpeg','MP3 音訊'],['1A45DFA3','webm','video/webm','WebM／MKV 影片'],
 ['4D5A','exe','application/vnd.microsoft.portable-executable','Windows 執行檔 (EXE／DLL)'],['7F454C46','elf','application/x-executable','Linux ELF 執行檔'],['CAFEBABE','class','application/java-vm','Java class／Mach-O Universal'],['CFFAEDFE','macho','application/x-mach-binary','macOS Mach-O 執行檔'],
 ['0061736D','wasm','application/wasm','WebAssembly'],['53514C69746520666F726D6174203300','sqlite','application/vnd.sqlite3','SQLite 資料庫'],['424D','bmp','image/bmp','BMP 圖片'],['00000100','ico','image/x-icon','ICO 圖示'],['D0CF11E0','doc','application/msword','舊版 Office 文件 (doc／xls／ppt)'],['7B5C72746631','rtf','application/rtf','RTF 文件'],['774F4646','woff','font/woff','WOFF 字型'],['774F4632','woff2','font/woff2','WOFF2 字型']];
function zipKind(u,d){ // docx／xlsx／pptx／apk／jar 等都是 ZIP，從內部檔名判斷
 const L=new TextDecoder('latin1'),z=u.length>524288?L.decode(u.subarray(0,262144))+L.decode(u.subarray(u.length-262144)):L.decode(u);
 const K=[['word/','docx','application/vnd.openxmlformats-officedocument.wordprocessingml.document','Word 文件 (docx)'],['xl/','xlsx','application/vnd.openxmlformats-officedocument.spreadsheetml.sheet','Excel 活頁簿 (xlsx)'],['ppt/','pptx','application/vnd.openxmlformats-officedocument.presentationml.presentation','PowerPoint 簡報 (pptx)'],
  ['AndroidManifest.xml','apk','application/vnd.android.package-archive','Android 安裝檔 (apk)'],['application/epub+zip','epub','application/epub+zip','EPUB 電子書'],['vnd.oasis.opendocument.text','odt','application/vnd.oasis.opendocument.text','OpenDocument 文件 (odt)'],
  ['vnd.oasis.opendocument.spreadsheet','ods','application/vnd.oasis.opendocument.spreadsheet','OpenDocument 試算表 (ods)'],['vnd.oasis.opendocument.presentation','odp','application/vnd.oasis.opendocument.presentation','OpenDocument 簡報 (odp)'],['META-INF/MANIFEST.MF','jar','application/java-archive','Java 封裝檔 (jar)']];
 for(const [k,e,m,n] of K)if(z.includes(k))return{e,m,n};
 return d}
function sniff(u){const h=hx(u.subarray(0,16)).join('').toUpperCase();
 for(const [s,e,m,n] of SIG)if(h.startsWith(s))return s==='504B0304'?zipKind(u,{e,m,n}):{e,m,n};
 if(h.startsWith('52494646')){const t=String.fromCharCode(...u.subarray(8,12));if(t==='WEBP')return{e:'webp',m:'image/webp',n:'WebP 圖片'};if(t==='WAVE')return{e:'wav',m:'audio/wav',n:'WAV 音訊'};if(t==='AVI ')return{e:'avi',m:'video/x-msvideo',n:'AVI 影片'}}
