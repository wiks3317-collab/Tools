<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>圖片處理與編輯</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%96%BC%EF%B8%8F%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .tabs button {
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .note {
        margin: 0;
      }
      @media (max-width:600px) {
        .themes {
          width: 100%;
          justify-content: flex-start;
        }
        .tabs button {
          flex: 1 1 100%;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <a class="back" href="index.html">← 返回小工具集首頁</a>
          <h1>圖片處理與編輯</h1>
          <p class="tagline">批次轉檔、壓縮、旋轉與縮放，或進一步編輯、去背、裁切、調色及加上浮水印。</p>
        </div>
        <div class="themes" id="themes">主題：</div>
      </header>
      <nav class="tabs" role="tablist" aria-label="圖片工具選擇">
        <button class="on" type="button" role="tab" aria-selected="true" data-pane="batch">批次處理／轉檔</button
        ><button type="button" role="tab" aria-selected="false" data-pane="edit">圖片編輯／去背</button>
      </nav>
      <section class="pane on" id="pane-batch">
        <iframe class="tool-frame" id="batchFrame" title="圖片批次處理工具" src="image_tool.html"></iframe>
      </section>
      <section class="pane" id="pane-edit">
        <iframe class="tool-frame auto" id="editFrame" loading="lazy" title="圖片編輯與去背工具" src="photo_editor.html"></iframe>
      </section>
      <p class="note">圖片處理主要在瀏覽器本機執行。AI 去背、HEIC 轉檔及部分 PDF／字型資源需連線下載第三方元件。</p>
    </div>
  </body>
