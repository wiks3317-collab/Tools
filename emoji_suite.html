<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emoji／特殊符號圖庫</title>
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet" />
    <meta name="referrer" content="no-referrer" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%98%80%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <script src="common.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .tabs button {
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .note {
        margin: 0;
      }
      .tool-frame {
        height: 800px;
        min-height: 0 !important;
        max-height: none !important;
      }
      @media (max-width:600px) {
        .themes {
          width: 100%;
          justify-content: flex-start;
        }
        .tabs button {
          flex: 1 1 100%;
          text-align: left;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div>
          <a class="back" href="index.html">← 返回小工具集首頁</a>
          <h1>Emoji／特殊符號圖庫</h1>
          <p class="tagline">依分類或關鍵字搜尋 emoji 與特殊符號，點一下就複製，也能組合多個一次複製。</p>
        </div>
        <div class="themes" id="themes">主題：</div>
      </header>
      <nav class="tabs" role="tablist" aria-label="圖庫選擇">
        <button class="on" type="button" role="tab" aria-selected="true" data-pane="emoji">Emoji 圖庫</button
        ><button type="button" role="tab" aria-selected="false" data-pane="symbol">特殊符號圖庫</button>
      </nav>
      <section class="pane on" id="pane-emoji">
        <iframe class="tool-frame fill" id="emojiFrame" scrolling="no" title="Emoji 圖庫" src="emoji_tool.html"></iframe>
      </section>
      <section class="pane" id="pane-symbol">
        <iframe class="tool-frame fill" id="symbolFrame" scrolling="no" title="特殊符號圖庫" src="symbol_tool.html" loading="lazy"></iframe>
      </section>
    </div>
      <script>
      // 接收子頁回報的內容高度，撐開對應的 iframe
      window.addEventListener('message', function (e) {
        var d = e.data;
        if (!d || d.type !== 'embed-height' || !(d.height > 0)) return;
        document.querySelectorAll('iframe.tool-frame').forEach(function (f) {
          if (f.contentWindow === e.source) f.style.height = d.height + 'px';
        });
      });
    </script>
  </body>
</html>
