<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件比對工具</title>
<!-- 禁止搜尋引擎收錄 -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">

<!-- 網頁 icon（內嵌 SVG：左右兩份文件，紅色=刪除、綠色=新增） -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='8' width='27' height='48' rx='5' fill='%23fff' stroke='%23475569' stroke-width='3'/%3E%3Crect x='34' y='8' width='27' height='48' rx='5' fill='%23fff' stroke='%23475569' stroke-width='3'/%3E%3Crect x='8' y='17' width='17' height='7' rx='2' fill='%23f87171'/%3E%3Crect x='8' y='30' width='17' height='5' rx='2' fill='%23cbd5e1'/%3E%3Crect x='8' y='41' width='11' height='5' rx='2' fill='%23cbd5e1'/%3E%3Crect x='39' y='17' width='17' height='5' rx='2' fill='%23cbd5e1'/%3E%3Crect x='39' y='28' width='17' height='7' rx='2' fill='%234ade80'/%3E%3Crect x='39' y='41' width='11' height='5' rx='2' fill='%23cbd5e1'/%3E%3C/svg%3E">
<script>try{const t=(localStorage.getItem('tools-theme')||localStorage.getItem('diff-theme'));if(t&&t!=='auto')document.documentElement.dataset.theme=t}catch(e){}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{color-scheme:light;--bg:#f5f6f7;--card:#ffffff;--fg:#2e3440;--mut:#667085;--bd:#e2e6ea;--gut:#eff1f3;--add:#dcebd5;--del:#f4dcdc;--emp:#eceef1;--pri:#4f729b;--prifg:#ffffff}
@media (prefers-color-scheme:dark){html:not([data-theme]){color-scheme:dark;--bg:#232831;--card:#2b313c;--fg:#e5e9f0;--mut:#9aa5b5;--bd:#3b4252;--gut:#323947;--add:#2f4a3a;--del:#553438;--emp:#2c323d;--pri:#88c0d0;--prifg:#20262e}}
html[data-theme=dark]{color-scheme:dark;--bg:#232831;--card:#2b313c;--fg:#e5e9f0;--mut:#9aa5b5;--bd:#3b4252;--gut:#323947;--add:#2f4a3a;--del:#553438;--emp:#2c323d;--pri:#88c0d0;--prifg:#20262e}
html[data-theme=sepia]{color-scheme:light;--bg:#f3efe7;--card:#fbf9f4;--fg:#3a352c;--mut:#7a7264;--bd:#e4dccb;--gut:#eee8da;--add:#dde7c8;--del:#f1d8cb;--emp:#e9e2d2;--pri:#8c6a43;--prifg:#ffffff}
html[data-theme=forest]{color-scheme:light;--bg:#eff2ee;--card:#fafbf9;--fg:#2a342d;--mut:#617066;--bd:#dce3dc;--gut:#e8ede8;--add:#d3e8cf;--del:#f2d9d6;--emp:#e4eae4;--pri:#4f7a62;--prifg:#ffffff}
html[data-theme=ocean]{color-scheme:dark;--bg:#1b2631;--card:#222f3c;--fg:#dce6ef;--mut:#92a4b6;--bd:#33445a;--gut:#293746;--add:#25513f;--del:#5a3340;--emp:#212e3b;--pri:#7fb7cc;--prifg:#13202b}
html[data-theme=dracula]{color-scheme:dark;--bg:#252833;--card:#2d313f;--fg:#e8eaf2;--mut:#9ea3b8;--bd:#3e4356;--gut:#353a4a;--add:#2f4d41;--del:#573545;--emp:#2e3240;--pri:#a8a0d6;--prifg:#1c1f2a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Noto Sans TC",system-ui,-apple-system,sans-serif}
header{padding:14px 20px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px}
.back{display:block;color:var(--mut);font-size:12px;text-decoration:none}.back:hover{color:var(--pri)}
.sub,.note{color:var(--mut);font-size:12px}
.note{margin-top:8px}
.themes{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut)}
.sw{width:22px;height:22px;border-radius:50%;padding:0;border:2px solid var(--bd);cursor:pointer}
.sw.on{outline:2px solid var(--pri);outline-offset:2px}
main{width:100%;padding:16px clamp(12px,2vw,24px) 56px;max-width:1180px;margin:0 auto}
.fold{margin:6px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:800px){.grid{grid-template-columns:1fr}}
.box{background:var(--card);border:1px solid var(--bd);border-radius:8px;overflow:hidden;min-width:0}
.hd{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
.fn{color:var(--mut);font-size:12px;flex:1;min-width:60px;word-break:break-all}
.pth,.box select{display:block;width:100%;border:0;border-bottom:1px solid var(--bd);padding:7px 10px;color:var(--fg);outline:none;font:12px ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace}
.pth{background:transparent}
.box select{background:var(--gut);font-size:13px;cursor:pointer}
.box select[hidden]{display:none}
option{background:var(--card);color:var(--fg)}
textarea{display:block;width:100%;height:220px;min-height:100px;border:0;padding:8px 10px;resize:vertical;background:transparent;color:var(--fg);
font:13px/20px ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace;white-space:pre;overflow:auto;outline:none}
button,.btn{background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:5px 12px;cursor:pointer;font:inherit;font-size:13px}
button:hover,.btn:hover{border-color:var(--pri)}
button:disabled{opacity:.4;cursor:default}
.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg)}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:10px;align-items:center;margin:8px 0;padding:8px 0;flex-wrap:wrap}
.nav{display:flex;gap:6px;align-items:center}
#cnt{min-width:64px;text-align:center;font-size:13px;color:var(--mut)}
label.chk{display:flex;gap:4px;align-items:center;color:var(--mut);font-size:13px}
#stat{margin-left:auto;font-size:13px}
.ga{background:var(--add);padding:1px 8px;border-radius:4px}.gd{background:var(--del);padding:1px 8px;border-radius:4px}
.pane{height:max(320px,calc(100vh - 200px));min-height:120px;resize:vertical;overflow:auto;position:relative;font:13px/20px ui-monospace,Menlo,Consolas,"Noto Sans TC",monospace}
.sizer{position:relative;min-width:100%}
.win{position:absolute;left:0;right:0;top:0}
.r{display:flex;height:20px}
.n{position:sticky;left:0;flex:none;width:52px;padding-right:8px;text-align:right;color:var(--mut);background:var(--gut);user-select:none}
.t{white-space:pre;padding-left:8px;flex:1}
.r.add{background:var(--add)}.r.del{background:var(--del)}
.r.e{background:repeating-linear-gradient(135deg,var(--emp),var(--emp) 6px,transparent 6px,transparent 12px)}
.r.cur .n{box-shadow:inset 4px 0 0 var(--pri);color:var(--fg);font-weight:600}
#res{display:none;scroll-margin-top:64px}
input[type=file]{display:none}
/* ===== Nordic layer：北歐簡約共用樣式 ===== */
:root{--r:12px;--r-s:8px;--soft:color-mix(in srgb,var(--pri) 11%,var(--card));--line:color-mix(in srgb,var(--bd) 70%,transparent)}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
*{scrollbar-width:thin;scrollbar-color:color-mix(in srgb,var(--mut) 38%,transparent) transparent}
::selection{background:color-mix(in srgb,var(--pri) 26%,transparent)}
body{font:15px/1.75 "Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;letter-spacing:.01em;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{text-underline-offset:3px}
:focus-visible{outline:2px solid color-mix(in srgb,var(--pri) 70%,transparent);outline-offset:2px}

/* 版面 */
.wrap,main{max-width:1120px;padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 80px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px 32px;flex-wrap:wrap;margin:0 0 clamp(22px,4vw,40px)}
h1{margin:6px 0 6px;font-size:clamp(22px,2.8vw,28px);font-weight:500;letter-spacing:.03em;line-height:1.35;color:var(--fg)}
.back{display:inline-flex;align-items:center;gap:4px;font-size:13px;color:var(--mut);text-decoration:none;transition:color .15s}
.back:hover{color:var(--pri)}
.sub,.tagline,.note,.tip,.msg,.hint,.adv-hint,.dzh{color:var(--mut);font-size:13px;line-height:1.75}
.sub,.tagline{max-width:46em;margin:0}
header>.back,header>h1,header>.sub,header>.tagline{flex:1 1 100%}
.lang-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

/* 主題切換 */
.themes{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--mut)}
.sw{width:18px;height:18px;border:1px solid var(--bd);transition:transform .15s}
.sw:hover{transform:scale(1.12)}
.sw.on{outline:2px solid var(--pri);outline-offset:2px}

/* 區塊 */
section{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:clamp(16px,2.6vw,26px);margin:0 0 16px}
.box{border-radius:var(--r)}
h2{font-size:15px;font-weight:500;letter-spacing:.02em;margin:0 0 14px}
.num{width:22px;height:22px;background:var(--soft);color:var(--pri);font-weight:500}
.field,.adv-field{margin-bottom:14px}
.row{gap:10px}

/* 按鈕 */
button,.btn{font:inherit;font-size:13.5px;line-height:1.4;padding:7px 15px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--card);color:var(--fg);transition:background .15s,border-color .15s,color .15s}
button:hover:not(:disabled):not(.pri):not(.on):not(.sw),.btn:hover:not(.pri){background:var(--gut);border-color:color-mix(in srgb,var(--pri) 45%,var(--bd))}
.pri,button.pri{background:var(--pri);border-color:var(--pri);color:var(--prifg);font-weight:500}
.pri:hover:not(:disabled),button.on:hover:not(:disabled){background:color-mix(in srgb,var(--pri) 86%,#000);border-color:color-mix(in srgb,var(--pri) 86%,#000)}
button:disabled{opacity:.45}
.clear-link{text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--pri) 40%,transparent)}
.chip-btn{border-radius:999px;border-color:color-mix(in srgb,var(--pri) 40%,var(--bd));padding:2px 12px;font-size:12.5px;background:transparent;transition:background .15s}
.chip-btn:hover{background:var(--soft)}

/* 輸入 */
.wrap select,.wrap input[type=text],.wrap input[type=password],.wrap input[type=number],.wrap input[type=search],.wrap input[type=url],.wrap input:not([type]),.wrap textarea,section textarea{font-size:14px;padding:7px 11px;border:1px solid var(--bd);border-radius:var(--r-s);background:var(--card);color:var(--fg);transition:border-color .15s,box-shadow .15s}
.wrap select:hover,.wrap input[type=text]:hover,.wrap textarea:hover{border-color:color-mix(in srgb,var(--mut) 45%,var(--bd))}
.wrap select:focus,.wrap input:focus,.wrap textarea:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)}
.wrap select{max-width:100%;text-overflow:ellipsis}
input[type=checkbox],input[type=radio],input[type=range]{accent-color:var(--pri)}
label{cursor:pointer}

/* 分頁 */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 20px;padding:0;border:0}
.tabs button{border:1px solid transparent;background:transparent;color:var(--mut);border-radius:999px;padding:6px 15px;font-weight:400}
.tabs button:hover:not(.on):not(:disabled):not(.pri):not(.sw){background:var(--gut);color:var(--fg);border-color:transparent}
.tabs button.on,.tabs button.on:hover:not(:disabled){background:var(--soft);color:var(--pri);border-color:transparent;font-weight:500}

/* 拖曳上傳區 */
.drop-zone,.drop{border:1.5px dashed color-mix(in srgb,var(--mut) 40%,var(--bd));border-radius:var(--r);padding:clamp(28px,6vw,44px) 20px;background:transparent;color:var(--mut);transition:border-color .15s,background .15s,color .15s}
.drop-zone:hover,.drop-zone.dragover,.drop:hover,.drop.over,.drop.dragover,.dz.over{border-color:var(--pri);background:var(--soft);color:var(--fg)}
.dz.over::after{background:var(--soft);border-radius:var(--r);font-weight:500}

/* 提示框 */
.privacy,.info{background:var(--gut);border:0;border-radius:var(--r-s);padding:10px 14px;font-size:13px;color:var(--mut)}
.warn{background:color-mix(in srgb,#bf616a 9%,var(--card));border:0;border-left:2px solid #bf616a;border-radius:var(--r-s);padding:10px 14px;font-size:13px;color:var(--mut)}
.err,.error{color:#bf616a}

/* 進階選項 */
details.advanced{border:1px solid var(--bd);border-radius:var(--r-s);background:transparent}
details.advanced summary{padding:10px 14px;font-size:13px;color:var(--mut);transition:color .15s}
details.advanced summary:hover{color:var(--fg)}
details.advanced[open] summary{border-bottom:1px solid var(--bd)}
.adv-body{padding:14px 16px 6px}

/* 進度與清單 */
.progress-bar-bg,.item-progress-bg{border-radius:999px}
.progress-bar-bg{height:6px}
.progress-bar-fill,.item-progress-fill{border-radius:999px}
.item-progress-fill.error{background:#bf616a}
#statusList{border-radius:var(--r-s);border-color:var(--bd)}
#statusList li,.file-row,.lst div{border-bottom:1px solid var(--line)}
#statusList li:last-child,.file-row:last-child,.lst div:last-child{border-bottom:0}
#previewText{border-radius:var(--r-s);background:var(--gut)}

/* 表格 */
th{font-weight:500;color:var(--mut)}
.tw{border-radius:var(--r-s)}
td{border-bottom-style:solid}
tr.row:hover{background:var(--gut)}

/* 圖庫與提示訊息 */
.e{border-radius:10px;transition:background .15s,border-color .15s}
.e:hover,.e.sel{background:var(--soft)}
#toast{border-radius:999px;padding:8px 18px;font-size:13px}

/* 平板以下 */
@media (max-width:860px){
  .wrap,main{padding-top:clamp(20px,4vw,36px)}
}
/* 手機 */
@media (max-width:640px){
  body{font-size:14.5px}
  .wrap,main{padding:20px 16px 56px}
  section{padding:16px;margin-bottom:12px}
  header{gap:12px}
  .themes{width:100%}
  .row{gap:8px}
  .wrap select,.wrap input[type=text],.wrap input[type=password],.wrap input[type=number],.wrap input[type=search],.wrap input:not([type]),.wrap textarea{font-size:16px}
}
/* 觸控裝置：放大點擊範圍 */
@media (pointer:coarse){
  button:not(.sw):not(.e){min-height:40px}
  .wrap select,.wrap input[type=text],.wrap input[type=number]{min-height:40px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* 文件比對：維持寬版，標頭與內容對齊 */
header{max-width:1320px;margin:0 auto;padding:clamp(24px,5vw,56px) clamp(16px,4vw,40px) 0}
main{max-width:1320px;padding-top:clamp(16px,3vw,28px)}
.bar{gap:10px 12px;padding:10px 0}
.hd{padding:10px 14px}
.hd b{font-weight:500}
.ga,.gd{border-radius:6px}
.fold button{background:transparent;border-color:transparent;color:var(--mut);padding-left:0}
@media (max-width:640px){header{padding:20px 16px 0}main{padding-top:12px}}
</style>
</head>
<body>
<header>
  <div><a class="back" href="index.html">← 小工具首頁</a><h1>文件比對工具</h1>
  <div class="sub">A = 舊檔案、B = 新檔案。所有比對皆在你的瀏覽器內完成，檔案不會上傳到任何伺服器。</div></div>
  <div class="themes" id="themes">主題：</div>
</header>
<main>
  <div class="fold"><button id="tog">▲ 收合檔案區</button></div>
  <div id="inbody">
    <div class="grid" id="inputs"></div>
    <div class="note">※ 瀏覽器基於安全限制，無法取得檔案的完整本機路徑；單檔上傳只會帶入檔名。若檔名重複，請用「選擇資料夾」（會帶入含資料夾的相對路徑，如 proj/src/a.js），或直接在路徑欄手動輸入。</div>
  </div>

  <div class="bar">
    <button class="pri" id="go">開始比對</button>
    <button id="swap">對調 A/B</button>
    <button id="clr">清除</button>
    <label class="chk"><input type="checkbox" id="ws"> 忽略行尾空白</label>
    <label class="chk"><input type="checkbox" id="ic"> 忽略大小寫</label>
    <span class="nav">
      <button id="prev" disabled title="快捷鍵：P">▲ 上一個差異</button>
      <span id="cnt">0 / 0</span>
      <button id="next" disabled title="快捷鍵：N">下一個差異 ▼</button>
    </span>
    <span id="stat"></span>
  </div>

  <div class="grid" id="res">
    <div class="box"><div class="hd"><b>A（舊檔案）</b><span class="fn" id="rpA"></span></div><div class="pane" id="pA"></div></div>
    <div class="box"><div class="hd"><b>B（新檔案）</b><span class="fn" id="rpB"></span></div><div class="pane" id="pB"></div></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const EXT = 'txt,md,js,c,docx,h,cpp,py,java,ts,html,css,json,xml,yml,yaml,csv,sh,sql,log,ini,php,go,rs,rb,kt,swift,cs'.split(',');
const F = {A:null, B:null};

// ---- 主題 ----
const THEMES = [['auto','跟隨系統','#ffffff','#2b313c'],['light','淺色','#f5f6f7','#4f729b'],['dark','深色','#232831','#88c0d0'],
  ['sepia','護眼米黃','#f3efe7','#8c6a43'],['forest','森林綠','#eff2ee','#4f7a62'],['ocean','深海藍','#1b2631','#7fb7cc'],['dracula','紫夜','#252833','#a8a0d6']];
function applyTheme(t){
  if (t === 'auto') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem('tools-theme', t); } catch(e){}
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.t === t));
}
THEMES.forEach(([id, name, c1, c2]) => {
  const b = document.createElement('button');
  b.className = 'sw'; b.dataset.t = id; b.title = name;
  b.style.background = `linear-gradient(135deg,${c1} 50%,${c2} 50%)`;
  b.onclick = () => applyTheme(id);
  $('themes').appendChild(b);
});
applyTheme(document.documentElement.dataset.theme || 'auto');

// ---- 建立輸入區 ----
$('inputs').innerHTML = ['A','B'].map(k => {
  const w = k === 'A' ? '舊' : '新';
  return `<div class="box"><div class="hd"><b>${k}（${w}檔案）</b><span style="flex:1"></span>
    <label class="btn">上傳檔案<input type="file" id="f${k}"></label>
    <label class="btn">選擇資料夾<input type="file" id="d${k}" webkitdirectory multiple></label></div>
    <input class="pth" id="path${k}" placeholder="檔案路徑（上傳後自動帶入，可手動修改）">
    <select id="sel${k}" hidden></select>
    <textarea id="t${k}" spellcheck="false" placeholder="貼上${w}檔案文字，或使用上方按鈕上傳"></textarea></div>`;
}).join('');

// ---- 收摺檔案區 ----
function setFold(f){
  $('inbody').hidden = f;
  $('tog').textContent = f ? '▼ 展開檔案區' : '▲ 收合檔案區';
}
$('tog').onclick = () => setFold(!$('inbody').hidden);

// ---- 左右兩框同步調整高度 ----
function syncResize(a, b, cb){
  const ro = new ResizeObserver(es => {
    for (const e of es){
      const h = e.target.offsetHeight; if (h < 60) continue;   // 隱藏中不處理
      const o = e.target === a ? b : a;
      if (Math.abs(o.offsetHeight - h) > 1) o.style.height = h + 'px';
    }
    if (cb) cb();
  });
  ro.observe(a); ro.observe(b);
}
syncResize($('tA'), $('tB'));

// ---- 讀檔 ----
async function readFile(file){
  const ext = file.name.split('.').pop().toLowerCase();
  if (ext === 'doc') throw new Error('不支援舊版 .doc，請先另存為 .docx');
  if (ext === 'docx'){
    if (!window.mammoth) throw new Error('Word 解析套件載入失敗，請確認網路連線');
    return (await mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()})).value;
  }
  return await file.text();
}
async function load(k, file){
  try { $('t'+k).value = await readFile(file); $('path'+k).value = file.webkitRelativePath || file.name; }
  catch(err){ alert(err.message); }
}
function setFolder(k, list){
  F[k] = list; const s = $('sel'+k);
  if (!list){ s.hidden = true; s.innerHTML = ''; return; }
  s.innerHTML = `<option value="">— 從資料夾選擇檔案（共 ${list.length} 個）—</option>` +
    list.map((f,i) => `<option value="${i}">${esc(f.webkitRelativePath)}</option>`).join('');
  s.hidden = false;
}
['A','B'].forEach(k => {
  $('f'+k).accept = EXT.map(e => '.'+e).join(',');
  $('f'+k).addEventListener('change', e => {
    const f = e.target.files[0]; e.target.value = '';
    if (f){ setFolder(k, null); load(k, f); }
  });
  $('d'+k).addEventListener('change', e => {
    const list = [...e.target.files].filter(f => !/(^|\/)(\.git|node_modules)\//.test(f.webkitRelativePath) &&
      EXT.includes(f.name.split('.').pop().toLowerCase()))
      .sort((a,b) => a.webkitRelativePath.localeCompare(b.webkitRelativePath));
    e.target.value = '';
    if (list.length) setFolder(k, list); else alert('此資料夾中沒有支援的檔案類型');
  });
  $('sel'+k).addEventListener('change', e => { const f = F[k] && F[k][e.target.value]; if (f) load(k, f); });
});

// ---- 差異演算法（行級 LCS） ----
function diffLines(a, b, ka, kb){
  let s = 0;
  while (s < a.length && s < b.length && ka[s] === kb[s]) s++;
  let ea = a.length, eb = b.length;
  while (ea > s && eb > s && ka[ea-1] === kb[eb-1]) { ea--; eb--; }
  const ops = [];
  for (let i = 0; i < s; i++) ops.push(['=', i, i]);
  const n = ea - s, m = eb - s, W = m + 1;
  if (n * m > 16e6){
    // Bounded-memory fallback: align common lines in order instead of marking the
    // entire middle region as unrelated. Exact LCS is reserved for smaller regions.
    const positions=new Map();
    for(let j=s;j<eb;j++){const key=kb[j];if(!positions.has(key))positions.set(key,[]);positions.get(key).push(j)}
    const used=new Map(),matches=[];let last=s-1;
    for(let i=s;i<ea;i++){
      const arr=positions.get(ka[i]);if(!arr)continue;
      let p=used.get(ka[i])||0;while(p<arr.length&&arr[p]<=last)p++;
      if(p<arr.length){const j=arr[p];used.set(ka[i],p+1);matches.push([i,j]);last=j}
    }
    let ai=s,bj=s;
    for(const [mi,mj] of matches){while(ai<mi)ops.push(['-',ai++,-1]);while(bj<mj)ops.push(['+',-1,bj++]);ops.push(['=',mi,mj]);ai=mi+1;bj=mj+1}
    while(ai<ea)ops.push(['-',ai++,-1]);while(bj<eb)ops.push(['+',-1,bj++]);
    ops.big = true;
  } else {
    const L = new Uint32Array((n+1) * W);
    for (let i = n-1; i >= 0; i--)
      for (let j = m-1; j >= 0; j--)
        L[i*W+j] = ka[s+i] === kb[s+j] ? L[(i+1)*W+j+1] + 1 : Math.max(L[(i+1)*W+j], L[i*W+j+1]);
    let i = 0, j = 0;
    while (i < n && j < m){
      if (ka[s+i] === kb[s+j]) { ops.push(['=', s+i, s+j]); i++; j++; }
      else if (L[(i+1)*W+j] >= L[i*W+j+1]) { ops.push(['-', s+i, -1]); i++; }
      else { ops.push(['+', -1, s+j]); j++; }
    }
    while (i < n) ops.push(['-', s+i++, -1]);
    while (j < m) ops.push(['+', -1, s+j++]);
  }
  for (let k = 0; k < a.length - ea; k++) ops.push(['=', ea+k, eb+k]);
  return ops;
}

// ---- 虛擬捲動渲染（只繪製可見的行） ----
const RH = 20, BUF = 40;
const pA = $('pA'), pB = $('pB');
let rows = [], blocks = [], cur = -1, cs = -1, ce = -1, rs = -1, re = -1, winA, winB;

function rowHtml(i, side){
  const r = rows[i], A = side === 'A';
  const cls = r.k === '=' ? '' : A ? (r.k === '-' ? 'del' : 'e') : (r.k === '+' ? 'add' : 'e');
  return `<div class="r ${cls}${i >= cs && i <= ce ? ' cur' : ''}"><span class="n">${(A ? r.a : r.b) || ''}</span><span class="t">${esc(A ? r.ta : r.tb)}</span></div>`;
}
function render(force){
  if (!winA) return;
  const top = pA.scrollTop, h = pA.clientHeight || 400;
  const vf = Math.floor(top / RH), vl = Math.ceil((top + h) / RH);
  if (!force && rs >= 0 && vf >= rs && vl <= re && (rs === 0 || vf - rs >= 10) && (re === rows.length || re - vl >= 10)) return;
  rs = Math.max(0, vf - BUF); re = Math.min(rows.length, vl + BUF);
  let a = '', b = '';
  for (let i = rs; i < re; i++){ a += rowHtml(i, 'A'); b += rowHtml(i, 'B'); }
  winA.style.top = winB.style.top = rs * RH + 'px';
  winA.innerHTML = a; winB.innerHTML = b;
}
[[pA,pB],[pB,pA]].forEach(([from, to]) => from.addEventListener('scroll', () => {
  if (Math.abs(to.scrollTop - from.scrollTop) > .5) to.scrollTop = from.scrollTop;
  if (Math.abs(to.scrollLeft - from.scrollLeft) > .5) to.scrollLeft = from.scrollLeft;
  render();
}, {passive:true}));
syncResize(pA, pB, () => render(true));

// ---- 差異導覽 ----
function updNav(){
  $('cnt').textContent = blocks.length ? `${cur + 1} / ${blocks.length}` : '0 / 0';
  $('prev').disabled = $('next').disabled = !blocks.length;
}
function go(d){
  if (!blocks.length) return;
  cur = cur < 0 ? (d > 0 ? 0 : blocks.length - 1) : (cur + d + blocks.length) % blocks.length;
  cs = blocks[cur].s; ce = blocks[cur].e;
  pA.scrollTop = pB.scrollTop = Math.max(0, cs * RH - pA.clientHeight / 3);
  render(true); updNav();
  const t = $('res').getBoundingClientRect().top;
  if (t < 0 || t > innerHeight * .5) $('res').scrollIntoView({block:'start'});
}
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'n' || e.key === 'N') go(1); else if (e.key === 'p' || e.key === 'P') go(-1);
});

// ---- 執行比對 ----
function run(){
  const split = t => t === '' ? [] : t.split(/\r\n|\r|\n/);
  const A = split($('tA').value), B = split($('tB').value);
  const norm = l => { if ($('ws').checked) l = l.replace(/\s+$/,''); if ($('ic').checked) l = l.toLowerCase(); return l; };
  const ops = diffLines(A, B, A.map(norm), B.map(norm));
  let add = 0, del = 0;
  rows = ops.map(([op, i, j]) => {
    if (op === '=') return {k:'=', a:i+1, b:j+1, ta:A[i], tb:B[j]};
    if (op === '-'){ del++; return {k:'-', a:i+1, b:0, ta:A[i], tb:''}; }
    add++; return {k:'+', a:0, b:j+1, ta:'', tb:B[j]};
  });
  blocks = [];
  rows.forEach((r, i) => {
    if (r.k === '=') return;
    const l = blocks[blocks.length - 1];
    if (l && l.e === i - 1) l.e = i; else blocks.push({s:i, e:i});
  });
  let ml = 0;
  for (const l of A) ml = Math.max(ml, l.length + (l.split('\t').length - 1) * 3);
  for (const l of B) ml = Math.max(ml, l.length + (l.split('\t').length - 1) * 3);
  for (const p of [pA, pB]){
    p.innerHTML = `<div class="sizer" style="height:${rows.length * RH}px;width:calc(72px + ${ml}ch)"><div class="win"></div></div>`;
    p.scrollTop = 0; p.scrollLeft = 0;
  }
  winA = pA.querySelector('.win'); winB = pB.querySelector('.win');
  cur = cs = ce = rs = re = -1;
  $('rpA').textContent = $('pathA').value.trim() || '（未指定路徑）';
  $('rpB').textContent = $('pathB').value.trim() || '（未指定路徑）';
  $('res').style.display = 'grid';
  $('stat').innerHTML = `<span class="ga">新增 ${add} 行</span> <span class="gd">刪除 ${del} 行</span>` +
    (add + del === 0 ? ' 兩個檔案內容相同' : '') + (ops.big ? ' （檔案過大，已簡化比對）' : '');
  setFold(true);                      // 比對後自動收合檔案區
  render(true); updNav();
  if (blocks.length) go(1);
  window.scrollTo({top: 0});
  if (!blocks.length) $('res').scrollIntoView({block:'start'});
}
$('go').onclick = run;

$('swap').onclick = () => {
  [$('tA').value, $('tB').value] = [$('tB').value, $('tA').value];
  [$('pathA').value, $('pathB').value] = [$('pathB').value, $('pathA').value];
  const t = F.A; setFolder('A', F.B); setFolder('B', t);
};
$('clr').onclick = () => {
  ['A','B'].forEach(k => { $('t'+k).value = ''; $('path'+k).value = ''; setFolder(k, null); });
  $('res').style.display = 'none'; $('stat').textContent = '';
  rows = []; blocks = []; cur = -1; updNav(); setFold(false);
};
</script>
</body>
</html>
